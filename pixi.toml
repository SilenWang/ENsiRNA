[workspace]
channels = ["conda-forge", "bioconda", "pytorch"]
name = "ensirna_env"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.1"

[tasks]
train = { cmd = "bash ENsiRNA/train.sh", description = "Train ENsiRNA model" }
predict = { cmd = "python ENsiRNA/predict.py", description = "Batch prediction from mRNA FASTA" }
score = { cmd = "python ENsiRNA/score.py", description = "Score a single siRNA-mRNA pair" }
test = { cmd = "python ENsiRNA/test.py", description = "Evaluate a checkpoint" }
prepare-data = { cmd = "python ENsiRNA/prepare_data.py", description = "Generate PDB + JSON from CSV" }
check-device = { cmd = "python -c \"import torch; print('CUDA:', torch.cuda.is_available()); print('MPS:', torch.backends.mps.is_available() if hasattr(torch.backends, 'mps') else 'N/A')\"", description = "Check CUDA/MPS availability" }

[dependencies]
viennarna = ">=2.6.4,<3"
python = "3.10.*"
biopython = "*"
numpy = ">=1,<2"
pandas = "*"
scipy = "*"
tensorboard = ">=2.20.0,<3"
tqdm = "*"
openpyxl = "*"
scikit-learn = ">=1.7.2,<2"
rdkit = ">=2026.3.2,<2027"
xgboost = ">=3.2.0,<4"
pip = "*"

pytorch = { version = ">=2.0", channel = "pytorch" }

[pypi-dependencies]
rna-fm = "*"
torch-geometric = "*"