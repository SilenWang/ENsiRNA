[workspace]
name = "ensiRNA-webui"
version = "0.1.0"
description = "ENsiRNA Gradio Web UI"
authors = ["SilenWang"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.10.*"
numpy = "*"
pandas = "*"
openpyxl = "*"
tqdm = "*"
gradio = "4.*"
pydantic = "2.*"
biopython = "*"
tensorboard = "*"
rdkit = "*"
scikit-learn = "*"
xgboost = "*"
viennarna = "2.6.4.*"

[pypi-dependencies]
torch = { version = "*", index = "https://download.pytorch.org/whl/cu118" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cu118" }
torchaudio = { version = "*", index = "https://download.pytorch.org/whl/cu118" }
fair-esm = ">=2"

[tasks]
start = "python webui/app.py"